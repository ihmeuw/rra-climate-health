name: Autoupdate dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  auto-update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          # The cluster envs need the IHME artifactory, which CI cannot reach.
          # Only the default + dev solve group is updated here.
          environments: dev

      - name: Update lockfile (default + dev envs only)
        id: update
        run: |
          pixi update --no-install -e default -e dev | tee /tmp/update.log
          if git diff --quiet pixi.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Format PR body
        if: steps.update.outputs.changed == 'true'
        id: body
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "body<<$EOF"
            echo "Auto-update of \`pixi.lock\` for the default + dev environments."
            echo ""
            echo "Cluster envs (with the IHME-internal \`jobmon\`) are not updated"
            echo "from CI because the runner cannot reach the IHME artifactory."
            echo "Refresh them locally with \`pixi update -e cluster -e cluster-dev\`."
            echo ""
            echo "<details><summary>pixi update output</summary>"
            echo ""
            echo '```'
            cat /tmp/update.log
            echo '```'
            echo ""
            echo "</details>"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

      # behaviour if PR already exists: https://github.com/marketplace/actions/create-pull-request#action-behaviour
      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        if: ${{ steps.update.outputs.changed == 'true' && env.GITHUB_TOKEN != 0 }}
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ env.GITHUB_TOKEN }}
          commit-message: >-
            chore: update dependencies
          title: "[Actions] Auto-Update dependencies"
          body: ${{ steps.body.outputs.body }}
          branch: chore/update-dependencies
          delete-branch: true
