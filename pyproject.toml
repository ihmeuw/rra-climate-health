[project]
name = "rra_climate_health"
version = "0.0.1"
description = "A collection of geospatial models examining the relationship between climate variables, socio-demographic indicators, and health outcomes."
authors = [
    {name = "Victor Vilchis Tella", email = "victorvt@uw.edu"},
]
license = {text = "BSD-3-Clause"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Runtime dependencies are managed by pixi (see [tool.pixi.*] below).
# This list is intentionally empty so that `pip install .` outside a pixi env
# does not pull mismatched versions of the R-binding stack (rpy2/pymer4) from
# PyPI, which is the root cause of the install fragility we are solving here.
dependencies = []

[project.urls]
documentation = "https://ihmeuw.github.io/rra-climate-health"
homepage = "https://ihmeuw.github.io/rra-climate-health"
repository = "https://github.com/ihmeuw/rra-climate-health"

[project.scripts]
strun = "rra_climate_health.cli:strun"
sttask = "rra_climate_health.cli:sttask"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rra_climate_health"]

# ---------------------------------------------------------------------------
# pixi configuration
# ---------------------------------------------------------------------------
# All runtime + dev dependencies live here. `pixi install` builds an env that
# matches `pixi.lock` exactly; `pixi.lock` is checked into the repo. R and the
# R packages (scam, lme4, lmerTest, emmeans, mgcv) come from conda-forge so
# that rpy2 is binary-compatible with the R it links against at runtime.
#
# jobmon (the IHME SLURM workflow tool) lives in the optional `cluster`
# feature so a default `pixi install` does not require IHME network access.
# Local devs and CI on public GitHub runners can install the default env
# anywhere; cluster users add `-e cluster` to pull jobmon from the IHME
# artifactory.
#
# Quick start:
#   pixi install                          # default runtime env (anywhere)
#   pixi shell                            # activate it
#   pixi install -e dev                   # adds linters, mypy, mkdocs, tests
#   pixi install -e cluster               # adds jobmon (IHME network only)
#   pixi install -e cluster-dev           # both
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
# The project itself, installed editable so local edits take effect.
rra_climate_health = { path = ".", editable = true }
# IHME packages not on conda-forge.
rra-tools = "==1.0.11"
rasterra = "==0.5.14"
# rpy2 3.5.x with python 3.12 + R 4.3 is not packaged on conda-forge (only
# rpy2 3.6+ is, which would force an R 4.4 upgrade and a pymer4 0.9 migration).
# The PyPI wheel links libR.so dynamically at runtime, so it will pick up the
# conda-forge R that pixi installs into the env's PATH.
rpy2 = "==3.5.16"
# pymer4 0.9+ ships a rewritten Lmer API that breaks training/run_training.py
# and training/training_validation.py. Stay on 0.8 until we choose to migrate.
pymer4 = "==0.8.2"
# Not on conda-forge.
reportlab = "==4.2.2"

[tool.pixi.dependencies]
# --- Python interpreter ----------------------------------------------------
python = "3.12.*"

# --- R stack ---------------------------------------------------------------
# Pinned to the versions that compose cleanly with rpy2 3.5.16 / pymer4 0.8.2.
r-base = "4.3.*"
r-scam = "1.2.*"
r-lme4 = "1.1.*"
r-lmertest = "3.1.*"
r-emmeans = "1.10.*"
r-mgcv = "1.9.*"

# --- Scientific Python stack ----------------------------------------------
numpy = ">=2.0,<3.0"
pandas = "2.2.*"
scipy = ">=1.14,<2.0"
scikit-learn = ">=1.5,<2.0"
matplotlib = ">=3.9,<4.0"
seaborn = ">=0.13,<0.14"
xarray = ">=2024.3"

# --- Geospatial -----------------------------------------------------------
geopandas = ">=1.0,<2.0"
rasterio = ">=1.3,<2.0"
rioxarray = ">=0.17,<1.0"

# --- I/O ------------------------------------------------------------------
pyarrow = ">=16.0"
netcdf4 = ">=1.7"
pydantic = ">=2.7,<3.0"
pyyaml = ">=6.0"

# --- CLI ------------------------------------------------------------------
click = ">=8.0"

# --- Build-time libs for the rpy2 source build ----------------------------
# rpy2 3.5.16 has no Linux wheels on PyPI, so it is built locally during
# `pixi install`. Its setup.py runs a link probe against libR.so and pulls in
# liblzma, libbz2, libpcre2, libiconv, and libicu. conda-forge ships the
# unversioned `.so` symlinks for these in the corresponding `*-devel`
# packages, which the meta-packages below bring along.
xz = "*"            # provides liblzma + liblzma-devel (link symlink)
bzip2 = "*"
libiconv = "*"
icu = "*"
pcre2 = "*"

# ---------------------------------------------------------------------------
# Dev feature: linters, type checking, tests, docs.
# Enable with `pixi install -e dev` or `pixi shell -e dev`.
# ---------------------------------------------------------------------------
[tool.pixi.feature.dev.dependencies]
mypy = "*"
pre-commit = "*"
pytest = "*"
pytest-cov = "*"
ruff = ">=0.2"
pandas-stubs = "*"
types-pyyaml = "*"

[tool.pixi.feature.dev.pypi-dependencies]
mkdocstrings = { version = "*", extras = ["python"] }
mkdocs-material = "*"
mkdocs-table-reader-plugin = "*"
pymdown-extensions = "*"
pytest-github-actions-annotate-failures = "*"
python-kacl = "*"

# ---------------------------------------------------------------------------
# Cluster feature: IHME-internal jobmon for SLURM workflow submission.
# Requires IHME network access to reach the artifactory. Enable with
# `pixi install -e cluster` or `pixi install -e cluster-dev`.
# ---------------------------------------------------------------------------
[tool.pixi.feature.cluster.pypi-dependencies]
jobmon-installer-ihme = ">=10.12.2"

[tool.pixi.feature.cluster.pypi-options]
extra-index-urls = [
    "https://artifactory.ihme.washington.edu/artifactory/api/pypi/pypi-shared/simple",
]

[tool.pixi.environments]
# `default` and `dev` solve together so they pin matching versions and work on
# any machine (including public CI runners). The cluster envs are in their
# own solve group because the IHME artifactory is only reachable from inside
# the network, and we don't want the default solve to fail off-network.
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
cluster = { features = ["cluster"], solve-group = "cluster" }
cluster-dev = { features = ["dev", "cluster"], solve-group = "cluster" }

# ---------------------------------------------------------------------------
# Lint / type-check / test configuration (unchanged from poetry layout).
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # flake8 missing trailing comma, fomatter handles
    "ISC001",   # Implicit string concatenation is not allowed
    "ANN",      # Type hints related, let mypy handle these.
    "D",        # Docstrings related, way too strict to our taste
    "T201",     # Use of `print` detected, we don't have formal logging yet.
    "PD901",    # Don't use generic 'df', practicality beats purity.
    "PD008",    # .at is okay
    "PD010",    # I like .unstack()
    "PD101",    # nunique is totally reasonable to use and cleaner than the suggestion
    "PD015",    # pd.merge is a-ok
    "RET504",   # Assign to variable before return, useful for debugging
    "FBT001",   # Boolean type positional arg, annoying with cli flags
    "S603",     # Supbrocess arg validation, prone to false positives
    "FIX002",   # TODOs are okay.
    "TD002",    # TODOs don't need an author
    "TD003",    # TODOs don't need a linked issue
    "PYI041",   # float | int is better explicit typing than depending on a special case
    "RUF005",   # list concatenation is fine
    "RUF007",   # zip is idiomatic, this check is dumb.
    "RET505",   # Else after return, too many false positives.
    "E501",     # Line too long, handled by ruff format
    "UP038",    # tuple in isinstance is fine
    "PERF401",  # Loops are sometimes fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # "Use of `assert` detected"
    "ARG",      # "Unused function argument". Fixtures are often unused.
    "S105",     # "Possible hardcoded password".
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "classmethod",
    "pydantic.validator",
    "pydantic.root_validator",
]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
addopts = """\
    --cov rra_climate_health \
    --cov tests \
    --cov-report term-missing \
    --no-cov-on-fail \
"""

[tool.mypy]
strict = true
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = [
    "affine.*",
    "geopandas.*",
    "rasterio.*",
    "scipy.*",
    "seaborn.*",
    "shapely.*",
    "sklearn.*",
    "rpy2.*",
    "pymer4.*",
    "reportlab.*",
]
ignore_missing_imports = true
