model_type: "scam"
version:
  model: "2026_03_24.01"
  training_data: "2026_03_19.04"  

measure: "neonatal_mortality"  
holdout:
  type: "no_holdout" 
predictors:
  - name: "intercept"
    random_effect: "ihme_loc_id"  
  - name: "consumption_pd"
    spline:
      bs: "mpd"
      k: 14
  - name: "days_over_30C_prev_0_mo"
    spline:
      bs: 'mpi'
      k: 14
  - name: "total_precipitation_prev_0_mo"
  - name: "sex_id"
    transform:
      type: 'categorical'
  - name: "birth_year"
    transform:
      type: 'categorical'